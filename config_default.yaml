# siwu-daily-report 全局默认配置
# 控制台修改后会覆盖这里的默认值

# ============================
# 总开关
# ============================
# 是否启用群聊日报
report_enabled: true

# 每天生成日报的时间（HH:MM，24 小时制）
report_time: '23:00'

# ============================
# 群聊范围（白名单 / 黑名单）
# ============================
# 群聊白名单：只给这些群发送日报（填写群号，多个用逗号分隔）。
# 留空 [] 表示不限制，默认所有群都发送
report_group_whitelist: []

# 群聊黑名单：这些群不发送日报。黑名单优先于白名单
report_group_blacklist: []

# ============================
# LLM 分析（可选）
# ============================
# 日报的「热门话题 / 群友称号 / 群圣经」需要 LLM 理解能力。
# 配置以下三项后启用；不配置或调用失败时，自动使用本地规则生成对应段落，
# 基础统计（消息数/人数/字符/表情/活跃时段）始终本地计算，不受影响。
report_llm_api_key: ''
report_llm_base_url: 'https://api.deepseek.com'
report_llm_model: 'deepseek-chat'

# ============================
# 报告内容
# ============================
# 热门话题数量
report_topics_count: 5
# 群友称号数量
report_titles_count: 6
# 群圣经条数
report_bible_count: 3
# 传给 LLM 的对话样本上限（超长时均匀采样 + 保留结尾）
report_max_transcript: 150
# 历史消息保留天数（超出自动清理，减小数据库体积）
report_retention_days: 7

# ============================
# 日志
# ============================
# 控制台输出日报记录/生成/发送日志
report_debug_log: true
